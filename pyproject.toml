[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comex-etl"
version = "0.1.0"
description = "Clean messy import data, compute landed cost per SKU, load it into SQL and report it."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emiliano Andrés Ibarra" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
comex-etl = "comex_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
comex_etl = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PD"]
